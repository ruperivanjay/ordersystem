<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Ordering System</title>
    <link rel="icon" href="data:,">
    <style>
        :root { --glass: rgba(255, 255, 255, 0.1); --border: rgba(255, 255, 255, 0.2); }
        body { margin: 0; font-family: sans-serif; background: linear-gradient(135deg, #1a1a2e, #16213e); color: white; min-height: 100vh; }
        .navbar { background: rgba(0,0,0,0.3); padding: 1rem 5%; display: flex; justify-content: space-between; border-bottom: 1px solid var(--border); }
        .container { padding: 2rem 5%; }
        .panel { background: var(--glass); backdrop-filter: blur(10px); border: 1px solid var(--border); border-radius: 15px; padding: 20px; margin-bottom: 20px; }
        .item-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }
        .item-card { background: rgba(255,255,255,0.05); padding: 15px; border-radius: 10px; cursor: pointer; border: 1px solid transparent; }
        .item-card:hover { border-color: #00d2ad; background: rgba(255,255,255,0.1); }
        input { width: 100%; padding: 10px; margin: 10px 0; border-radius: 5px; border: 1px solid var(--border); background: #000; color: #fff; }
        button { background: #00d2ad; color: white; border: none; padding: 12px; border-radius: 5px; cursor: pointer; width: 100%; font-weight: bold; }
        table { width: 100%; border-collapse: collapse; }
        th, td { padding: 12px; text-align: left; border-bottom: 1px solid var(--border); }
    </style>
</head>
<body>
    <div class="navbar">
        <h2>Ordering System</h2>
        <a th:href="@{/dashboard}" style="color: #00d2ad; text-decoration: none;">← Back</a>
    </div>

    <div class="container">
        <div class="panel">
            <h3>Select Items</h3>
            <div id="itemGrid" class="item-grid"></div>
        </div>

        <div class="panel">
            <h3>Checkout</h3>
            <input type="text" id="custName" placeholder="Customer Name">
            <input type="number" id="orderTotal" placeholder="Total Amount" readonly>
            <button onclick="placeOrder()">Process Order</button>
        </div>

        <div class="panel">
            <h3>Recent Orders</h3>
            <table>
                <thead><tr><th>ID</th><th>Customer</th><th>Total</th><th>Status</th><th>Action</th></tr></thead>
                <tbody id="orderTableBody"></tbody>
            </table>
        </div>
    </div>

    <script th:src="@{/js/auth.js}"></script>
    <script>
        // INTERNAL FUNCTIONS - Resolves the ReferenceError immediately
        async function fetchItems() {
            const res = await fetch('/api/products');
            const items = await res.json();
            document.getElementById('itemGrid').innerHTML = items.map(i => `
                <div class="item-card" onclick="document.getElementById('orderTotal').value=${i.price}">
                    <strong>${i.name}</strong><br>₱${i.price.toFixed(2)}
                </div>
            `).join('');
        }

        async function fetchOrders() {
            const res = await fetch('/api/orders');
            const orders = await res.json();
            document.getElementById('orderTableBody').innerHTML = orders.map(o => `
                <tr>
                    <td>#${o.id}</td>
                    <td>${o.customerName || 'Guest'}</td>
                    <td>₱${o.totalAmount.toFixed(2)}</td>
                    <td>${o.status}</td>
                    <td><button style="width:auto; padding:5px 10px;" onclick="updateStatus(${o.id})">Done</button></td>
                </tr>
            `).join('');
        }

        async function placeOrder() {
            const data = {
                customerName: document.getElementById('custName').value,
                totalAmount: parseFloat(document.getElementById('orderTotal').value),
                status: 'Pending'
            };
            await fetch('/api/orders', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify(data)
            });
            fetchOrders();
        }

        async function updateStatus(id) {
            await fetch(`/api/orders/${id}/status`, {
                method: 'PUT',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ status: 'Completed' })
            });
            fetchOrders();
        }

        // Initialize
        document.addEventListener('DOMContentLoaded', () => {
            fetchItems();
            fetchOrders();
        });
    </script>
</body>
</html>
