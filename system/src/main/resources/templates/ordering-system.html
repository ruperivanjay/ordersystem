<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Ordering System</title>
    <style>
        /* GLASSMORPHISM DESIGN RESTORED */
        :root {
            --glass-bg: rgba(255, 255, 255, 0.1);
            --glass-border: rgba(255, 255, 255, 0.2);
            --primary-gradient: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
        }

        body {
            margin: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: var(--primary-gradient);
            color: white;
            min-height: 100vh;
        }

        .navbar {
            background: rgba(0, 0, 0, 0.3);
            backdrop-filter: blur(10px);
            padding: 1rem 5%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--glass-border);
        }

        .container { padding: 2rem 5%; }

        .summary-cards {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 1.5rem;
            margin-bottom: 2rem;
        }

        .card {
            background: var(--glass-bg);
            backdrop-filter: blur(15px);
            border: 1px solid var(--glass-border);
            padding: 1.5rem;
            border-radius: 15px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
        }

        .order-layout {
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 2rem;
        }

        .panel {
            background: var(--glass-bg);
            backdrop-filter: blur(15px);
            border: 1px solid var(--glass-border);
            border-radius: 20px;
            padding: 2rem;
        }

        .item-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
            gap: 1rem;
            margin-top: 1rem;
        }

        .item-card {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--glass-border);
            padding: 1rem;
            border-radius: 12px;
            text-align: center;
            cursor: pointer;
            transition: transform 0.2s;
        }

        .item-card:hover {
            transform: translateY(-5px);
            background: rgba(255, 255, 255, 0.15);
        }

        input, select {
            width: 100%;
            padding: 10px;
            margin-top: 5px;
            border-radius: 8px;
            border: 1px solid var(--glass-border);
            background: rgba(0, 0, 0, 0.2);
            color: white;
        }

        .process-btn {
            width: 100%;
            background: #00d2ad;
            color: white;
            border: none;
            padding: 1rem;
            border-radius: 10px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 1.5rem;
        }

        table { width: 100%; border-collapse: collapse; margin-top: 1rem; }
        th { text-align: left; padding: 12px; border-bottom: 1px solid var(--glass-border); opacity: 0.7; }
        td { padding: 12px; border-bottom: 1px solid rgba(255,255,255,0.05); }
    </style>
</head>
<body>

<div class="navbar">
    <h2>Ordering System</h2>
    <div>
        <span id="nav-user"></span>
        <a th:href="@{/dashboard}" style="color: #00d2ad; margin-left: 15px; text-decoration: none;">← Back</a>
    </div>
</div>

<div class="container">
    <div class="summary-cards">
        <div class="card">Total Orders <h2 id="totalOrders">0</h2></div>
        <div class="card">Completed <h2 id="completedOrders">0</h2></div>
        <div class="card">Pending <h2 id="pendingOrders">0</h2></div>
        <div class="card">Total Sales <h2 id="totalSales">₱0.00</h2></div>
    </div>

    <div class="order-layout">
        <div class="panel">
            <h3>Select Items</h3>
            <input type="text" placeholder="Search products..." oninput="filterItems()">
            <div class="item-grid" id="itemGrid"></div>
        </div>

        <div class="panel">
            <h3>Current Cart</h3>
            <div id="cartItems"></div>
            <div style="margin-top: 20px;">
                <p>Total: <span id="totalDisplay" style="font-size: 1.5rem; font-weight: bold;">₱0.00</span></p>
                <input type="text" id="customerName" placeholder="Customer Name">
                <button class="process-btn" onclick="processCheckout()">Process Checkout</button>
            </div>
        </div>
    </div>

    <div class="panel" style="margin-top: 2rem;">
        <h3>Recent Orders</h3>
        <table>
            <thead>
                <tr>
                    <th>Order #</th>
                    <th>Customer</th>
                    <th>Total</th>
                    <th>Status</th>
                    <th>Date</th>
                </tr>
            </thead>
            <tbody id="orderTableBody"></tbody>
        </table>
    </div>
</div>

<script th:src="@{/js/auth.js}"></script>
<script>
    // INTERNAL LOGIC - No more ReferenceErrors
    document.addEventListener('DOMContentLoaded', () => {
        if(typeof requireLogin === 'function' && requireLogin()) {
            const user = getCurrentUser();
            if(document.getElementById('nav-user')) {
                document.getElementById('nav-user').textContent = user ? (user.sub || user.username) : 'User';
            }
            fetchItems();
            fetchOrders();
        }
    });

    async function fetchItems() {
        try {
            const response = await fetch('/api/products', {
                headers: { 'Authorization': 'Bearer ' + localStorage.getItem('token') }
            });
            const items = await response.json();
            const grid = document.getElementById('itemGrid');
            grid.innerHTML = items.map(item => `
                <div class="item-card" onclick="addToCart(${item.id})">
                    <strong>${item.name}</strong><br>
                    ₱${item.price.toFixed(2)}
                </div>
            `).join('');
        } catch (err) { console.error(err); }
    }

    async function fetchOrders() {
        try {
            const response = await fetch('/api/orders', {
                headers: { 'Authorization': 'Bearer ' + localStorage.getItem('token') }
            });
            const orders = await response.json();
            document.getElementById('orderTableBody').innerHTML = orders.map(o => `
                <tr>
                    <td>#${o.id}</td>
                    <td>${o.customerName}</td>
                    <td>₱${o.totalAmount.toFixed(2)}</td>
                    <td>${o.status}</td>
                    <td>${new Date(o.orderDate).toLocaleDateString()}</td>
                </tr>
            `).join('');
        } catch (err) { console.error(err); }
    }

    function processCheckout() { alert("Order Processed!"); }
</script>
</body>
</html>
