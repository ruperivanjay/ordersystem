<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Ordering System - Classic Version</title>
    <!-- CSS Link Removed as requested -->
    <style>
        /* Basic layout styling to keep the page readable without the CSS file */
        body { font-family: sans-serif; padding: 20px; }
        .container { display: flex; gap: 20px; }
        .panel { border: 1px solid #ccc; padding: 15px; flex: 1; }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th, td { border: 1px solid #ddd; padding: 8px; text-align: left; }
        .item-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }
        .item-card { border: 1px solid #bbb; padding: 10px; cursor: pointer; text-align: center; }
        .item-card:hover { background: #f0f0f0; }
    </style>
</head>
<body>

    <h1>Ordering System</h1>
    <p>Logged in as: <span id="nav-user"></span> | <a th:href="@{/dashboard}">Back to Menu</a></p>

    <div class="container">
        <!-- Left Panel: Products -->
        <div class="panel">
            <h3>Products</h3>
            <div class="item-grid" id="itemGrid">
                <!-- Products will load here -->
            </div>
        </div>

        <!-- Right Panel: Cart -->
        <div class="panel">
            <h3>Your Cart</h3>
            <div id="cartItems">
                <p>Select an item to start.</p>
            </div>
            <hr>
            <p>Total: <strong id="totalDisplay">₱0.00</strong></p>
            <button onclick="processCheckout()">Process Checkout</button>
        </div>
    </div>

    <h3>Recent Orders</h3>
    <table>
        <thead>
            <tr>
                <th>Order ID</th>
                <th>Customer</th>
                <th>Total</th>
                <th>Status</th>
                <th>Date</th>
            </tr>
        </thead>
        <tbody id="orderTableBody">
            <!-- Orders will load here -->
        </tbody>
    </table>

    <!-- AUTHENTICATION SCRIPT -->
    <script th:src="@{/js/auth.js}"></script>

    <!-- INTERNAL LOGIC (REVERTED FROM order-logic.js) -->
    <script>
        // Runs immediately on page load
        document.addEventListener('DOMContentLoaded', () => {
            if(typeof requireLogin === 'function' && requireLogin()) {
                const user = getCurrentUser();
                document.getElementById('nav-user').textContent = user ? (user.sub || user.username) : 'User';
                
                fetchItems();
                fetchOrders();
            }
        });

        async function fetchItems() {
            try {
                const response = await fetch('/api/products', {
                    headers: { 'Authorization': 'Bearer ' + localStorage.getItem('token') }
                });
                const items = await response.json();
                const grid = document.getElementById('itemGrid');
                
                grid.innerHTML = items.map(item => `
                    <div class="item-card" onclick="alert('Added ' + '${item.name}')">
                        <strong>${item.name}</strong><br>
                        ₱${item.price.toFixed(2)}
                    </div>
                `).join('');
            } catch (err) {
                console.error("Failed to load products", err);
            }
        }

        async function fetchOrders() {
            try {
                const response = await fetch('/api/orders', {
                    headers: { 'Authorization': 'Bearer ' + localStorage.getItem('token') }
                });
                const orders = await response.json();
                const tbody = document.getElementById('orderTableBody');
                
                tbody.innerHTML = orders.map(o => `
                    <tr>
                        <td>#${o.id}</td>
                        <td>${o.customerName}</td>
                        <td>₱${o.totalAmount.toFixed(2)}</td>
                        <td>${o.status}</td>
                        <td>${new Date(o.orderDate).toLocaleDateString()}</td>
                    </tr>
                `).join('');
            } catch (err) {
                console.error("Failed to load orders", err);
            }
        }

        function processCheckout() {
            alert("Checkout logic reverted to simple alert.");
        }
    </script>
</body>
</html>
